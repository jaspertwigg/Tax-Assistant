name: Deploy to Firebase

# Runs once the repository variables/secrets described in the README are set.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Write web app config
        env:
          API_KEY: ${{ vars.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          REGION: ${{ vars.FIREBASE_FUNCTIONS_REGION || 'us-central1' }}
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=$API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$AUTH_DOMAIN"
            echo "VITE_FIREBASE_PROJECT_ID=$PROJECT_ID"
            echo "VITE_FIREBASE_STORAGE_BUCKET=$STORAGE_BUCKET"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$SENDER_ID"
            echo "VITE_FIREBASE_APP_ID=$APP_ID"
            echo "VITE_FIREBASE_FUNCTIONS_REGION=$REGION"
          } > .env.production
      - name: Write service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
